  persona: emp-1005          # Tom Becker, basic, operations
  question: "I need to spend about $1,200 on a conference trip. Do I need approval first, and what's the hotel limit?"
  must_include: ["manager approval", "$300 per night"]
  must_not_include: []
  kind: answer
  split: train

