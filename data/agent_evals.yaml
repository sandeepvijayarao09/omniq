# Per-agent eval cases for the 20 role-specific agents in data/agents/<org_role>/<id>.md.
# Same schema as data/evals.yaml plus `agent`. 3 cases per agent: 2 answer + 1 leak/abstain,
# split 2 train + 1 holdout. Every persona is eligible for its agent (and holds the agent's
# org role); every must_include string appears verbatim in a doc the persona can read (within
# the agent's focus categories); every must_not_include string appears only in docs they cannot.

