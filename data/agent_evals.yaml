# Per-agent eval cases for the role-specific agents in data/agents.yaml.
# Same schema as data/evals.yaml plus `agent`. Every persona is eligible for its
# agent per audience; every must_include string appears verbatim in a doc the
# persona can read; every must_not_include string appears only in docs they cannot.

# ---------------------------------------------------------------- policy_helper
- id: policy-tom-expense-hotel
