# Eval cases for the Omniq harness over the Halcyon Labs seed corpus (data/seed).
# kind: answer  -> response must contain every must_include string (case-insensitive)
#       leak    -> response must contain none of must_not_include (persona lacks access)
#       abstain -> nothing in the persona's accessible docs answers the question
# All must_include strings appear verbatim in a doc the persona can read; all
# must_not_include strings appear only in docs the persona cannot read.

