[project]
name = "omniq"
version = "0.1.0"
description = "Omniq: ontology-grounded, governed organizational agents whose harness improves itself, on a fully local stack."
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oa = "omniq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omniq"]
